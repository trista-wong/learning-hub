<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 寶寶的快樂學習小幫手 🌟</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Itim for cute child-friendly handwriting feel -->
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Confetti JS for celebration animations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Itim', cursive, sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #e0ffff 50%, #fffacd 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .pulse-glow {
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-6 relative overflow-x-hidden">

    <!-- Decorative background floating elements -->
    <div class="absolute top-10 left-6 text-3xl float-animation opacity-75 pointer-events-none">🌸</div>
    <div class="absolute top-16 right-8 text-3xl float-animation opacity-75 pointer-events-none" style="animation-delay: 1s;">⭐</div>
    <div class="absolute bottom-10 left-10 text-3xl float-animation opacity-75 pointer-events-none" style="animation-delay: 2s;">🎈</div>
    <div class="absolute bottom-16 right-6 text-3xl float-animation opacity-75 pointer-events-none" style="animation-delay: 1.5s;">🐱</div>

    <!-- Top Header & Sound Control -->
    <header class="w-full max-w-2xl flex flex-col sm:flex-row items-center justify-between mb-4 z-10 bg-white/75 backdrop-blur-md p-3 sm:p-4 rounded-2xl shadow-md border border-pink-100">
        <div class="flex items-center space-x-2 mb-2 sm:mb-0">
            <span class="text-3xl">🎒</span>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-pink-500 tracking-wide">快樂學習小天地</h1>
                <p class="text-xs text-gray-500">每天進步一點點，加油！✨</p>
            </div>
        </div>
        <!-- Background Music & Sound Toggle -->
        <div class="flex items-center space-x-2">
            <button id="musicToggleBtn" onclick="toggleMusic()" class="flex items-center space-x-1 bg-pink-100 hover:bg-pink-200 text-pink-600 px-3 py-1.5 rounded-full font-bold shadow transition transform hover:scale-105 text-xs sm:text-sm cursor-pointer">
                <span id="musicIcon">🔇</span>
                <span id="musicText">背景音樂</span>
            </button>
            <button onclick="triggerConfetti()" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-700 px-3 py-1.5 rounded-full font-bold shadow transition transform hover:scale-105 text-xs sm:text-sm cursor-pointer">
                🎉 放煙火
            </button>
        </div>
    </header>

    <!-- Welcome Greeting Banner -->
    <main class="w-full max-w-2xl flex flex-col items-center z-10 mb-6">
        <div class="bg-white/80 backdrop-blur-md rounded-2xl p-4 sm:p-5 shadow-md border-2 border-pink-200 text-center w-full mb-6 relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 text-7xl opacity-10 pointer-events-none">🐼</div>
            <h2 class="text-base sm:text-xl font-bold text-indigo-500 mb-1">👋 哈囉！今天想複習什麼呢？</h2>
            <p class="text-gray-600 text-xs sm:text-sm">點擊下方的小幫手卡片，開始溫習之旅吧！</p>
        </div>

        <!-- Subject Cards Grid: 2 columns layout -->
        <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full">
            
            <!-- Card 1: 中文 (Redirects to chi/chinese.html) -->
            <div class="group bg-gradient-to-br from-pink-100 to-pink-200 rounded-2xl p-4 shadow-md border-2 border-pink-300 flex flex-col items-center text-center transform transition duration-300 hover:scale-105 hover:shadow-xl pulse-glow relative overflow-hidden">
                <div class="absolute top-2 right-2 text-pink-400 opacity-60 text-lg">📖</div>
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-full flex items-center justify-center text-3xl sm:text-4xl mb-2 sm:mb-3 shadow-inner group-hover:rotate-12 transition duration-300">
                    🐼
                </div>
                <h3 class="text-sm sm:text-lg font-bold text-pink-700 mb-0.5 group-hover:text-pink-800">中文默書</h3>
                <p class="text-[11px] sm:text-xs text-pink-500 font-medium mb-3">上學期</p>
                
                <div class="w-full flex flex-col space-y-2 mt-auto">
                    <a href="chi/chinese.html"
                       onclick="triggerConfetti()"
                       class="w-full bg-white hover:bg-pink-500 text-pink-600 hover:text-white font-bold py-2 px-3 rounded-xl shadow-sm text-xs transition duration-300 flex items-center justify-center space-x-1 cursor-pointer border border-pink-200">
                        <span>📝</span>
                        <span>第一次默書</span>
                    </a>
                </div>
            </div>

            <!-- Card 2: English dictation 1 -->
            <div class="group bg-gradient-to-br from-cyan-100 to-blue-200 rounded-2xl p-4 shadow-md border-2 border-cyan-300 flex flex-col items-center text-center transform transition duration-300 hover:scale-105 hover:shadow-xl pulse-glow relative overflow-hidden">
                <div class="absolute top-2 right-2 text-cyan-600 opacity-60 text-lg">🔤</div>
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-full flex items-center justify-center text-3xl sm:text-4xl mb-2 sm:mb-3 shadow-inner group-hover:rotate-12 transition duration-300">
                    🐶
                </div>
                <h3 class="text-sm sm:text-lg font-bold text-cyan-800 mb-1 group-hover:text-cyan-900">English dictation</h3>
                <p class="text-[11px] sm:text-xs text-cyan-700 font-medium mb-3">1st semester</p>
                
                <div class="w-full flex flex-col space-y-2 mt-auto">
                    <a href="https://trista-wong.github.io/Dictation-revision/" target="_blank" rel="noopener noreferrer"
                       onclick="triggerConfetti()"
                       class="w-full bg-white hover:bg-cyan-500 text-cyan-600 hover:text-white font-bold py-2 px-3 rounded-xl shadow-sm text-xs transition duration-300 flex items-center justify-center space-x-1 cursor-pointer border border-cyan-200">
                        <span>⭐</span>
                        <span>dictation 1</span>
                    </a>
                </div>
            </div>

            <!-- Card 3: 數學單元一 -->
            <a href="https://trista-wong.github.io/math-revsion/" target="_blank" rel="noopener noreferrer"
               class="group bg-gradient-to-br from-yellow-100 to-amber-200 rounded-2xl p-4 shadow-md border-2 border-yellow-300 flex flex-col items-center text-center transform transition duration-300 hover:scale-105 hover:shadow-xl pulse-glow relative overflow-hidden col-span-2 sm:col-span-1">
                <div class="absolute top-2 right-2 text-yellow-600 opacity-60 text-lg">🔢</div>
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-full flex items-center justify-center text-3xl sm:text-4xl mb-2 sm:mb-3 shadow-inner group-hover:rotate-12 transition duration-300">
                    🐱
                </div>
                <h3 class="text-sm sm:text-lg font-bold text-amber-800 mb-0.5 group-hover:text-amber-900">數學</h3>
                <p class="text-[11px] sm:text-xs text-amber-700 font-medium mb-3">上學期</p>
                <div class="w-full mt-auto">
                    <span class="w-full bg-white text-amber-600 font-bold py-2 px-3 rounded-xl shadow-sm text-xs group-hover:bg-amber-500 group-hover:text-white transition duration-350 flex items-center justify-center space-x-1 border border-amber-200">
                        <span>🎯</span>
                        <span>第一單元</span>
                    </span>
                </div>
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-gray-500 text-xs z-10 mt-4 py-2 border-t border-gray-200/50">
        <p>Made with 💖 for Smart Kids | 祝你學習愉快！✨</p>
    </footer>

    <!-- JavaScript Audio and Confetti Logic -->
    <script>
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Background cheerful melody generator
        const melody = [
            {note: 523.25, duration: 400}, // C5
            {note: 587.33, duration: 400}, // D5
            {note: 659.25, duration: 400}, // E5
            {note: 698.46, duration: 400}, // F5
            {note: 783.99, duration: 800}, // G5
            {note: 659.25, duration: 400}, // E5
            {note: 523.25, duration: 800}  // C5
        ];
        let melodyIndex = 0;

        function playMelodyNote() {
            if (!isMusicPlaying) return;
            try {
                const currentNote = melody[melodyIndex];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(currentNote.note, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (currentNote.duration / 1000) * 0.9);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + currentNote.duration / 1000);

                melodyIndex = (melodyIndex + 1) % melody.length;
                musicInterval = setTimeout(playMelodyNote, currentNote.duration);
            } catch (e) {
                console.log("BGM error", e);
            }
        }

        function toggleMusic() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isMusicPlaying = !isMusicPlaying;
            const icon = document.getElementById('musicIcon');
            const text = document.getElementById('musicText');

            if (isMusicPlaying) {
                icon.textContent = "🎵";
                text.textContent = "播放中";
                melodyIndex = 0;
                playMelodyNote();
            } else {
                icon.textContent = "🔇";
                text.textContent = "背景音樂";
                if (musicInterval) {
                    clearTimeout(musicInterval);
                }
            }
        }

        // Confetti effect
        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ffb6c1', '#afeeee', '#fffacd', '#ff69b4', '#ffd700']
            });
        }
    </script>
</body>
</html>
