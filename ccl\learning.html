<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徐小學習平台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <div id="app" class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-indigo-600 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center">
                <div class="flex items-center space-x-3 mb-4 sm:mb-0">
                    <div class="bg-white text-indigo-600 p-3 rounded-xl shadow-inner">
                        <i class="fa-solid fa-graduation-cap text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">徐小學習平台</h1>
                        <p class="text-indigo-200 text-sm">電子學習資源與重要連結分頁</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 bg-indigo-700/60 px-4 py-2 rounded-lg text-sm border border-indigo-500/40">
                    <i class="fa-solid fa-file-pdf text-rose-300"></i>
                    <a href="https://www.ccl.edu.hk/file_browser/Uploads/2627/2627_080.pdf?openinbrowser=0" target="_blank" class="hover:underline text-indigo-100 flex items-center gap-1">
                        查看官方指引 PDF <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
            <!-- Search and Filter Bar -->
            <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="relative w-full md:w-96">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="搜尋學習資源或連結..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-sm">
                </div>
                <div class="flex flex-wrap gap-2 w-full md:w-auto" id="categoryFilters">
                    <button data-category="all" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-sm transition-all">全部資源</button>
                    <button data-category="platform" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all">線上平台</button>
                    <button data-category="tool" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all">學術工具</button>
                    <button data-category="document" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all">通告與參考</button>
                </div>
            </div>

            <!-- Resource Cards Grid -->
            <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be populated by JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16">
                <div class="text-slate-300 text-5xl mb-3">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <p class="text-slate-500 font-medium">找不到符合條件的學習資源</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm">
            <p>徐小學習平台 &copy; 2026 | 資料來源：學校通告及相關網上資源</p>
        </footer>
    </div>

    <script>
        const resources = [
            {
                title: "徐小通告與文件參考 (PDF)",
                description: "檢視原檔案內容與相關官方指引、注意事項及各項通告詳情。",
                url: "https://www.ccl.edu.hk/file_browser/Uploads/2627/2627_080.pdf?openinbrowser=0",
                category: "document",
                icon: "fa-file-pdf",
                badge: "官方文件",
                badgeColor: "bg-rose-100 text-rose-700"
            },
            {
                title: "電子學習綜合平台",
                description: "學校指定的網上學習及課業提交平台，方便同學隨時隨地進行網上自學。",
                url: "https://www.ccl.edu.hk",
                category: "platform",
                icon: "fa-laptop-code",
                badge: "主要平台",
                badgeColor: "bg-indigo-100 text-indigo-700"
            },
            {
                title: "網上電子圖書館",
                description: "提供豐富的電子圖書資源與閱讀獎勵計劃，培養良好閱讀習慣。",
                url: "https://www.ccl.edu.hk",
                category: "tool",
                icon: "fa-book-open",
                badge: "閱讀專區",
                badgeColor: "bg-emerald-100 text-emerald-700"
            },
            {
                title: "互動學科練習專區",
                description: "涵蓋中文、英文、數學及常識科目的互動練習題目與自我評量。",
                url: "https://www.ccl.edu.hk",
                category: "platform",
                icon: "fa-brain",
                badge: "學科練習",
                badgeColor: "bg-amber-100 text-amber-700"
            },
            {
                title: "聯絡與學校資訊網頁",
                description: "了解學校最新動態、行事曆及教職員聯絡方法。",
                url: "https://www.ccl.edu.hk",
                category: "document",
                icon: "fa-school",
                badge: "學校資訊",
                badgeColor: "bg-blue-100 text-blue-700"
            }
        ];

        const resourceGrid = document.getElementById('resourceGrid');
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const emptyState = document.getElementById('emptyState');

        let currentCategory = 'all';
        let searchQuery = '';

        function renderResources() {
            const filtered = resources.filter(item => {
                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            resourceGrid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                                <i class="fa-solid ${item.icon}"></i>
                            </div>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${item.badgeColor}">${item.badge}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-2 group-hover:text-indigo-600 transition-colors">${item.title}</h3>
                        <p class="text-slate-600 text-sm leading-relaxed mb-6">${item.description}</p>
                    </div>
                    <a href="${item.url}" target="_blank" class="w-full bg-slate-50 hover:bg-indigo-600 hover:text-white text-slate-700 border border-slate-200 hover:border-transparent py-2.5 px-4 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-all">
                        <span>進入連結</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                `;
                resourceGrid.appendChild(card);
            });
        }

        // Search event
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderResources();
        });

        // Filter events
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
                });
                btn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');

                currentCategory = btn.getAttribute('data-category');
                renderResources();
            });
        });

        // Initial render
        renderResources();
    </script>
</body>
</html>

```eof
